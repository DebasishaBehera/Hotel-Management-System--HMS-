<div class="admin-container admin-edit-shell">
  <div class="edit-ambient edit-ambient-one" aria-hidden="true"></div>
  <div class="edit-ambient edit-ambient-two" aria-hidden="true"></div>

  <header class="edit-hero">
    <div>
      <p class="page-kicker">Reservations Desk</p>
      <h2>Edit Booking</h2>
      <p class="subtitle">Update the details for this booking.</p>
    </div>
    <div class="edit-hero-meta" aria-label="Edit status">
      <span>Admin edit</span>
      <span>Live validation</span>
    </div>
  </header>

  <form (ngSubmit)="updateBooking()" class="room-form" *ngIf="!loading; else loadingTpl">
    <div class="form-row">
      <label>Room</label>
      <input type="text" [value]="form.roomLabel" readonly />
    </div>

    <div class="form-row-inline">
      <div>
        <label>Check-in</label>
        <input
          type="date"
          [(ngModel)]="form.checkInDate"
          name="checkInDate"
          [min]="today"
          (ngModelChange)="onCheckInDateChange()"
          required
        />
      </div>
      <div>
        <label>Check-out</label>
        <input
          type="date"
          [(ngModel)]="form.checkOutDate"
          name="checkOutDate"
          [min]="minCheckOutDate"
          (ngModelChange)="onCheckOutDateChange()"
          required
        />
      </div>
    </div>

    <p class="booked-date-hint">
      <span class="booked-date-dot" aria-hidden="true"></span>
      Gray dates are already booked and cannot be selected.
    </p>

    <div class="form-row">
      <label>Guests</label>
      <input
        type="number"
        [(ngModel)]="form.guests"
        name="guests"
        min="1"
        [max]="roomCapacity || null"
        required
      />
      <p class="capacity-hint" *ngIf="roomCapacity">Maximum {{ roomCapacity }} guests for this room.</p>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="!canSubmitUpdate">Update Booking</button>
      <button type="button" class="secondary" (click)="goBack()">Cancel</button>
    </div>
  </form>

  <ng-template #loadingTpl>
    <p class="info">Loading booking...</p>
  </ng-template>

  <p class="msg" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>
</div>
